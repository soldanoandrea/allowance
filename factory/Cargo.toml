[package]
name = "allowance-factory"
description = "Creates Allowance vaults as sub-accounts that use the vault code as a NEAR global contract (by code hash)"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false
repository = "https://github.com/soldanoandrea/allowance"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
