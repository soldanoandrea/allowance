name: Test
on:
  push:
  pull_request:

jobs:
  tests:
    name: Contract tests + local demo (sandbox)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install cargo-near CLI
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh | sh
      - name: Format check
        run: cargo fmt --check
      - name: Run cargo test (vault, factory, test token; unit + sandbox)
        run: cargo test --workspace
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: TypeScript tests incl. the sandbox end-to-end test
        run: make build sandbox-node && npm test
      - name: make demo (sandbox, vault, paid API, agent loop, attack)
        run: make demo

  typescript:
    name: TypeScript typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests (mocked RPC; the sandbox test skips itself here)
        run: npm test
